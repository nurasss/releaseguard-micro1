name: Release
on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and Publish
        run: |
          python -m pip install --upgrade build twine
          python -m build
          echo "Publishing release package to repository index"
